name: Web CI

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'shared/**'
      - 'package-lock.json'
      - '.github/workflows/web-ci.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'shared/**'
      - 'package-lock.json'
      - '.github/workflows/web-ci.yml'

jobs:
  web:
    name: Lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm

      # Also builds shared/dist via its prepare script, which web imports.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run -w web lint

      - name: Lint CSS
        run: npm run -w web lint:css

      - name: Test
        run: npm run -w web test
