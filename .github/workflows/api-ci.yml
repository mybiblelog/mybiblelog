name: API CI

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'shared/**'
      - 'package-lock.json'
      - '.github/workflows/api-ci.yml'
  pull_request:
    paths:
      - 'api/**'
      - 'shared/**'
      - 'package-lock.json'
      - '.github/workflows/api-ci.yml'

jobs:
  api:
    name: Lint, type-check, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm

      # Also builds shared/dist via its prepare script, which api imports.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run -w api lint

      - name: Type-check
        run: npm run -w api type-check

      # Server-free suites only; see api/vitest.unit.config.ts.
      - name: Test
        run: npm run -w api test:unit
