name: Shared CI

on:
  push:
    branches: [main]
    paths:
      - 'shared/**'
      - 'package-lock.json'
      - '.github/workflows/shared-ci.yml'
  pull_request:
    paths:
      - 'shared/**'
      - 'package-lock.json'
      - '.github/workflows/shared-ci.yml'

jobs:
  shared:
    name: Lint, type-check, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run -w shared lint

      - name: Type-check
        run: npm run -w shared type-check

      - name: Test
        run: npm run -w shared test
