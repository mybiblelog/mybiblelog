# Login preamble for the screenshot capture flow.
#
# Deliberately NOT the same as common/login.yaml: that one handles a cold,
# cleared-state launch from scratch (Expo launcher deep link, dev-menu
# dismissal, gear-button swipe). capture.yaml already handles the equivalent
# launch/dev-menu/onboarding preamble itself once per suite run, plus forcing
# a logout of whatever account the dev-client happened to be signed into, so
# by the time this runs the Account screen is guaranteed logged-out with the
# login button visible — this file just fills in the login form.
#
# Expects E2E_EMAIL / E2E_PASSWORD env vars.
appId: com.mybiblelog.app
---
- tapOn:
    id: "settings.login"
- extendedWaitUntil:
    visible:
      id: "login.email"
    timeout: 15000
- tapOn:
    id: "login.email"
# The field pre-fills with the previously logged-in email (login.tsx's
# "sign in again as X" UX) once capture.yaml has forced a logout — inputText
# appends at the cursor rather than replacing, so clear it first or repeated
# runs double up the typed value (demo@example.comdemo@example.com).
- eraseText
- inputText: ${E2E_EMAIL}
- hideKeyboard
- tapOn:
    id: "login.password"
- eraseText
- inputText: ${E2E_PASSWORD}
- hideKeyboard
- tapOn:
    id: "login.submit"
# Successful login pops back to the Account screen, where the login button is
# replaced by the logout button. `settings.logout` is the locale-independent
# "authenticated" signal (never visible on the login screen itself, so no
# mid-transition false positive).
- extendedWaitUntil:
    visible:
      id: "settings.logout"
    timeout: 30000
