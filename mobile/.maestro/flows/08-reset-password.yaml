# Reset a password by typing the emailed code into the app, then signing in with
# the new password automatically. Independent of REQUIRE_EMAIL_VERIFICATION.
appId: com.mybiblelog.app
tags:
  - email-code
---
- runFlow: ../common/open-app.yaml
- tapOn:
    id: "tab.settings"
- tapOn: "Account"
- tapOn:
    id: "settings.login"
- extendedWaitUntil:
    visible:
      id: "login.forgot-password"
    timeout: 15000
- tapOn:
    id: "login.forgot-password"
- extendedWaitUntil:
    visible:
      id: "forgot-password.email"
    timeout: 15000
- tapOn:
    id: "forgot-password.email"
- inputText: ${E2E_EMAIL}
- hideKeyboard
- tapOn:
    id: "forgot-password.submit"
- extendedWaitUntil:
    visible:
      id: "forgot-password.code.code"
    timeout: 15000
- runScript:
    file: ../scripts/fetch-email-code.js
    env:
      EMAIL_TO: ${E2E_EMAIL}
      EMAIL_SUBJECT: "Reset Password"
- assertTrue: ${output.code != null}
- tapOn:
    id: "forgot-password.code.code"
# Typing the full code auto-submits it and reveals the new-password step. Don't
# hideKeyboard here: the step transition unmounts the code field and dismisses
# the keyboard on its own, so Maestro's back-press would instead pop this screen
# back to Login and the new-password field would never appear.
- inputText: ${output.code}
- extendedWaitUntil:
    visible:
      id: "forgot-password.code.new-password"
    timeout: 15000
- tapOn:
    id: "forgot-password.code.new-password"
- inputText: "newpassword456"
- hideKeyboard
- tapOn:
    id: "forgot-password.code.confirm-password"
- inputText: "newpassword456"
- hideKeyboard
- tapOn:
    id: "forgot-password.code.submit"
# On success the app establishes a session and returns to Today.
- extendedWaitUntil:
    visible:
      id: "today.add-entry"
    timeout: 20000

# --- Restore the original password -------------------------------------
# The app has no in-session change-password screen, so the only way back to
# E2E_PASSWORD is another forgot-password round-trip. Without this, every
# later flow that logs in with E2E_PASSWORD (09-change-email included) would
# fail against the password this flow just changed.
- tapOn:
    id: "tab.settings"
- tapOn: "Account"
- tapOn:
    id: "settings.logout"
- tapOn:
    id: "settings.logout-confirm"
- extendedWaitUntil:
    visible:
      id: "settings.login"
    timeout: 15000
- tapOn:
    id: "settings.login"
- extendedWaitUntil:
    visible:
      id: "login.forgot-password"
    timeout: 15000
- tapOn:
    id: "login.forgot-password"
- extendedWaitUntil:
    visible:
      id: "forgot-password.email"
    timeout: 15000
- tapOn:
    id: "forgot-password.email"
- inputText: ${E2E_EMAIL}
- hideKeyboard
- tapOn:
    id: "forgot-password.submit"
- extendedWaitUntil:
    visible:
      id: "forgot-password.code.code"
    timeout: 15000
- runScript:
    file: ../scripts/fetch-email-code.js
    env:
      EMAIL_TO: ${E2E_EMAIL}
      EMAIL_SUBJECT: "Reset Password"
- assertTrue: ${output.code != null}
- tapOn:
    id: "forgot-password.code.code"
- inputText: ${output.code}
- extendedWaitUntil:
    visible:
      id: "forgot-password.code.new-password"
    timeout: 15000
- tapOn:
    id: "forgot-password.code.new-password"
- inputText: ${E2E_PASSWORD}
- hideKeyboard
- tapOn:
    id: "forgot-password.code.confirm-password"
- inputText: ${E2E_PASSWORD}
- hideKeyboard
- tapOn:
    id: "forgot-password.code.submit"
- extendedWaitUntil:
    visible:
      id: "today.add-entry"
    timeout: 20000
