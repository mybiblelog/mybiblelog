# Reusable login: cold-start with cleared state, then email/password sign-in.
#
# The app is offline-first and never forces a login redirect — sign-in lives
# at Settings -> Account -> Login. Google Sign-In is a native SDK sheet and
# cannot be automated; email login is the automated path. Expects
# E2E_EMAIL / E2E_PASSWORD env vars.
appId: com.mybiblelog.app
---
- runFlow:
    file: ./cold-launch.yaml
# A genuinely fresh install lands on the onboarding wizard instead of Today.
# Dismiss it via its shortest path (Skip, on the Welcome step) so e2e flows
# don't have to care about onboarding; `screenshots/capture.yaml` uses the
# same guard. A dev-client already used for regular development will already
# have onboarding completed, making this a no-op there.
- extendedWaitUntil:
    optional: true
    visible:
      id: "onboarding.choice-new"
    timeout: 90000
- runFlow:
    when:
      visible:
        id: "onboarding.choice-new"
    commands:
      - tapOn:
          id: "onboarding.choice-new"
      - tapOn:
          id: "onboarding.welcome-skip"
- extendedWaitUntil:
    visible:
      id: "today.add-entry"
    timeout: 90000
# The dev-client's floating gear button hovers over the top-right corner and
# steals taps meant for header buttons (Add, Create Tag, ...). Drag it down
# the right edge, out of every tap target used by the flows.
- swipe:
    start: 90%, 7%
    end: 90%, 65%
- tapOn:
    id: "tab.settings"
- tapOn: "Account"
- tapOn:
    id: "settings.login"
- extendedWaitUntil:
    visible:
      id: "login.email"
    timeout: 15000
- tapOn:
    id: "login.email"
- inputText: ${E2E_EMAIL}
- hideKeyboard
- tapOn:
    id: "login.password"
- inputText: ${E2E_PASSWORD}
- hideKeyboard
- tapOn:
    id: "login.submit"
# Successful login pops back to the Account screen; return to Today.
- extendedWaitUntil:
    visible: "Logout"
    timeout: 20000
- tapOn:
    id: "tab.today"
- extendedWaitUntil:
    visible:
      id: "today.add-entry"
    timeout: 15000
