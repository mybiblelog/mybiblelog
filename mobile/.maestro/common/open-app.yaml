# Reusable bootstrap: cold-start the dev-client with cleared state and reach the
# Today screen (logged out). Mirrors the launch sequence in common/login.yaml but
# stops before signing in, so flows that drive register / forgot-password can
# start from a clean, logged-out app.
appId: com.mybiblelog.app
---
- runFlow:
    file: ./cold-launch.yaml
# A genuinely fresh install lands on the onboarding wizard instead of Today.
# Dismiss it via its shortest path (Skip, on the Welcome step) so e2e flows
# don't have to care about onboarding; `screenshots/capture.yaml` uses the
# same guard. A dev-client already used for regular development will already
# have onboarding completed, making this a no-op there.
- extendedWaitUntil:
    optional: true
    visible:
      id: "onboarding.choice-new"
    timeout: 90000
- runFlow:
    when:
      visible:
        id: "onboarding.choice-new"
    commands:
      - tapOn:
          id: "onboarding.choice-new"
      - tapOn:
          id: "onboarding.welcome-skip"
- extendedWaitUntil:
    visible:
      id: "today.add-entry"
    timeout: 90000
# Drag the dev-client's floating gear button out of the top-right tap targets.
- swipe:
    start: 90%, 7%
    end: 90%, 65%
