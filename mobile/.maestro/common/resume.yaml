# Fast preamble for flows after 01: reuse the warm, already-logged-in session
# established by 01-login instead of paying a full cold start + login again.
#
# Foreground the running app (no process restart, no JS reload), then confirm
# the session on Settings -> Account: `settings.logout` renders only when
# authenticated. The app is offline-first, so the tab bar alone can't tell a
# logged-in app from a logged-out one. Without a logged-in session (or if the
# app never reaches its tab bar), fall through to the full cold login. Switching back to Today pops
# the Settings stack (popToTopOnBlur), so later flows start from its root.
appId: com.mybiblelog.app
---
- launchApp:
    stopApp: false
- runFlow:
    when:
      visible:
        id: "tab.today"
    commands:
      - tapOn:
          id: "tab.settings"
      - tapOn:
          id: "settings.account-link"
      # Auth state can briefly render as "loading" before settling.
      - extendedWaitUntil:
          optional: true
          visible:
            id: "settings.logout"
          timeout: 5000
- runFlow:
    when:
      notVisible:
        id: "settings.logout"
    file: ./login.yaml
- tapOn:
    id: "tab.today"
- assertVisible:
    id: "today.add-entry"
